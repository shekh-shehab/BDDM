<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download File Info</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="128x128" href="icon.png">
<link rel="stylesheet" href="theme.css">
<script src="scheme.js"></script>
<style>
  .more { margin: 4px 0 8px; font-size: 13px; }
  .more summary { cursor: pointer; color: var(--text2); margin-bottom: 8px; }
  .more textarea { width: 100%; box-sizing: border-box; font: 12px/1.4 Consolas, monospace; resize: vertical; }
  .catnote { font-weight: 400; color: var(--muted); }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; font-weight: 600; font-size: 15px; }
  header img { width: 24px; height: 24px; flex: none; border-radius: 8px; display: block; }
  main { flex: 0 1 auto; min-height: 0; padding: 8px 18px 8px; overflow: auto; }
  .field label { text-transform: none; letter-spacing: 0; }
  input[type=text], select, textarea {
    flex: 1; width: 100%; font: inherit; color: var(--text); background: var(--neutral);
    border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select { min-width: 200px; }

  .value.muted { color: var(--muted); }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; min-width: 0; }
  .row2 .field.size { flex: 0 0 140px; }
  button.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  .warn { display: none; gap: 10px; align-items: flex-start; background: var(--badge-pause-bg); border: 1px solid var(--badge-pause-bd); color: var(--badge-pause-fg); border-radius: 12px; padding: 10px 12px; margin-bottom: 13px; font-size: 13px; }
  .warn.show { display: flex; }
  .warn b { word-break: break-all; }
  .err { color: var(--text-danger); font-size: 13px; min-height: 18px; }
  footer { display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border); }
  footer .spacer { flex: 1; }
  .dim { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <img src="icon-32.png" alt="" width="24" height="24">
  Download File Info
</header>
<main>
  <div class="warn" id="dup">
    <span>&#9888;</span>
    <span>You already downloaded this file<span id="dupName"></span>. Download it again? It will be saved with a new name.</span>
  </div>
  <div class="field" id="fmtField" hidden>
    <label for="fmt">Save as</label>
    <select id="fmt"></select>
  </div>
  <div class="field">
    <label for="name">File name</label>
    <input id="name" type="text" spellcheck="false" autocomplete="off">
  </div>
  <div class="row2">
    <div class="field size">
      <label>Size</label>
      <div class="value" id="size">Checking...</div>
    </div>
    <div class="field">
      <label>Link</label>
      <div class="value muted" id="url">-</div>
    </div>
  </div>
  <div class="field">
    <label for="dir">Save to <span id="cat" class="catnote"></span></label>
    <div class="line">
      <input id="dir" type="text" spellcheck="false" autocomplete="off">
      <button id="browse">Change...</button>
    </div>
  </div>
  <details id="more" class="more">
    <summary>More options: checksum, mirror links</summary>
    <div class="field">
      <label for="hash">Checksum (optional)</label>
      <input id="hash" type="text" spellcheck="false" autocomplete="off" placeholder="MD5, SHA-1, SHA-256 or SHA-512 from the website">
    </div>
    <div class="field">
      <label for="mirrors">Mirror links (optional, one per line)</label>
      <textarea id="mirrors" rows="2" spellcheck="false" placeholder="Other links to the same file"></textarea>
    </div>
  </details>
  <div class="err" id="err"></div>
</main>
<footer>
  <button id="later" title="Add it to the list paused; press Resume when you want it">Download Later</button>
  <span class="spacer"></span>
  <button id="cancel">Cancel</button>
  <button id="start" class="primary">Start Download</button>
</footer>
<script src="fit.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get("id") || "";
const FMT_NAMES = { pdf: "PDF document (.pdf)", docx: "Word document (.docx)", txt: "Plain text (.txt)", xlsx: "Excel workbook (.xlsx)", csv: "CSV, first sheet (.csv)", pptx: "PowerPoint (.pptx)" };
let answered = false, nameTouched = false, dirTouched = false, timer = null;

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
function fmtBytes(n) {
  if (!n || n <= 0) return "Unknown";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : n >= 10 ? 1 : 2)) + " " + u[i];
}
function shortUrl(u) {
  try {
    const x = new URL(u);
    let p = decodeURIComponent(x.pathname);
    if (p.length > 34) p = p.slice(0, 14) + "..." + p.slice(-17);
    return x.host + p;
  } catch (e) { return u; }
}
function gone(msg) {
  answered = true;
  $("err").textContent = msg;
  for (const b of ["start", "later", "browse"]) $(b).disabled = true;
  $("cancel").textContent = "Close";
}
async function load() {
  let v;
  try { v = await api("/api/pending/" + encodeURIComponent(id)); }
  catch (e) { gone(e.message); return; }
  if (v.formats && v.formats.length && !$("fmt").options.length) {
    for (const f of v.formats) {
      const o = document.createElement("option");
      o.value = f; o.textContent = FMT_NAMES[f] || f.toUpperCase();
      $("fmt").append(o);
    }
    $("fmt").value = v.format || v.formats[0];
    $("fmtField").hidden = false;
    document.title = "Download Google file";
  }
  if (!nameTouched) $("name").value = v.name || "";
  if (!dirTouched) $("dir").value = v.dir || "";
  $("cat").textContent = v.category ? "(" + v.category + " folder)" : "";
  $("url").textContent = shortUrl(v.url);
  $("url").title = v.url;
  $("size").textContent = v.checking ? "Checking..." : fmtBytes(v.size);
  $("size").title = v.size > 0 ? v.size.toLocaleString() + " bytes" : "";
  if (v.duplicate) {
    $("dup").classList.add("show");
    $("dupName").innerHTML = "";
    if (v.dupName) { $("dupName").append(" ("); const b = document.createElement("b"); b.textContent = v.dupName; $("dupName").append(b, ")"); }
    $("start").textContent = "Download again";
  }
  if (!v.checking && v.problem && v.final) {
    $("err").textContent = v.problem;
    $("start").disabled = true;
    $("later").disabled = true;
  } else {
    $("err").textContent = !v.checking && v.problem ? "Note: the server did not answer the size check (" + v.problem + "). You can still try." : "";
  }
  if (v.formats && v.formats.length && !v.checking) $("size").textContent = "Not known yet";
  if (v.checking) timer = setTimeout(load, 700);
}
async function start(later) {
  $("err").textContent = "";
  for (const b of ["start", "later", "cancel"]) $(b).disabled = true;
  try {
    await api("/api/pending/" + encodeURIComponent(id) + "/start", { name: $("name").value, dir: dirTouched ? $("dir").value : "", later, format: $("fmt").value || "",
      hash: $("hash").value.trim(), mirrors: $("mirrors").value.split(/\s+/).filter(Boolean) });
    answered = true;
    window.close();
    setTimeout(() => gone(later ? "Added to BDDM (paused). You can close this window." : "Download started. You can close this window."), 300);
  } catch (e) {
    $("err").textContent = e.message;
    for (const b of ["start", "later", "cancel"]) $(b).disabled = false;
  }
}
async function cancel() {
  if (!answered) {
    answered = true;
    try { await api("/api/pending/" + encodeURIComponent(id) + "/cancel", {}); } catch (e) {}
  }
  window.close();
  setTimeout(() => gone("Cancelled. You can close this window."), 300);
}
$("name").oninput = () => { nameTouched = true; };
$("fmt").onchange = () => {
  const n = $("name").value, f = $("fmt").value;
  if (n) $("name").value = n.replace(/\.[A-Za-z0-9]{1,5}$/, "") + "." + f;
};
$("dir").oninput = () => { dirTouched = true; };
$("start").onclick = () => start(false);
$("later").onclick = () => start(true);
$("cancel").onclick = cancel;
$("browse").onclick = async () => {
  $("browse").disabled = true;
  try {
    const r = await api("/api/pickfolder", { start: $("dir").value });
    if (r.dir) { $("dir").value = r.dir; dirTouched = true; }
  } catch (e) { $("err").textContent = "Folder picker: " + e.message; }
  $("browse").disabled = false;
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !$("start").disabled) { e.preventDefault(); start(false); }
  if (e.key === "Escape") { e.preventDefault(); cancel(); }
});
// Closing the window with the X counts as Cancel.
window.addEventListener("pagehide", () => {
  if (answered) return;
  answered = true;
  fetch("/api/pending/" + encodeURIComponent(id) + "/cancel", {
    method: "POST", keepalive: true, headers: { "Content-Type": "application/json" }, body: "{}",
  }).catch(() => {});
});
load().then(() => { $("start").focus(); if (window.bddmFitWindow) bddmFitWindow(); });
(function () {
  const scheme = new URLSearchParams(location.search).get("scheme");
  if (scheme === "dark" || scheme === "light") document.documentElement.dataset.scheme = scheme;
})();
</script>
</body>
</html>
