<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download complete</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="128x128" href="icon.png">
<link rel="stylesheet" href="theme.css">
<script src="scheme.js"></script>
<style>
  html, body { margin: 0; }
  body { display: flex; flex-direction: column; }
  .window { flex: none; width: 100%; box-sizing: border-box; padding: 18px 20px 16px; text-align: center; background: var(--surface); }
  .check { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-success); color: var(--text-success); display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 8px; font-weight: 700; }
  h1 { font-size: 14px; font-weight: 600; margin: 0; }
  .actions-row { justify-content: center; margin-top: 12px; }
</style>
</head>
<body>
<div class="window">
  <div class="check" aria-hidden="true">✓</div>
  <h1>Download complete</h1>
  <p class="meta" id="name" style="margin:6px 0 2px">—</p>
  <p class="meta" id="meta" style="margin-bottom:12px">—</p>
  <div class="actions-row">
    <button type="button" class="pill prim" id="open">Open</button>
    <button type="button" class="pill" id="folder">Open folder</button>
    <button type="button" class="pill" id="close">Close</button>
  </div>
  <p class="hint" id="err" style="color:var(--text-danger);margin-top:8px"></p>
</div>
<script src="fit.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const id = q.get("id") || "";
const scheme = q.get("scheme");
if (scheme === "dark" || scheme === "light") document.documentElement.dataset.scheme = scheme;

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
function fmtSize(n) {
  if (!n || n <= 0) return "";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i === 0 ? 0 : 1) + " " + u[i];
}
function duration(start, end) {
  if (!start || !end || start.startsWith("0001") || end.startsWith("0001")) return "";
  const sec = Math.max(0, Math.round((new Date(end) - new Date(start)) / 1000));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h) return h + " h " + m + " min";
  if (m) return m + " min " + s + " sec";
  return s + " sec";
}
(async () => {
  if (!id) return;
  try {
    const j = await api("/api/jobs/" + encodeURIComponent(id));
    $("name").textContent = j.name || "File";
    const parts = [];
    if (j.size > 0) parts.push(fmtSize(j.size));
    const d = duration(j.started, j.finished);
    if (d) parts.push("in " + d);
    $("meta").textContent = parts.join(" ") || "Finished";
  } catch (e) { $("err").textContent = e.message; }
  if (window.bddmFitWindow) bddmFitWindow();
})();
$("open").onclick = async () => {
  $("err").textContent = "";
  try { await api("/api/jobs/" + encodeURIComponent(id) + "/openfile", {}); } catch (e) { $("err").textContent = e.message; }
};
$("folder").onclick = async () => {
  $("err").textContent = "";
  try { await api("/api/jobs/" + encodeURIComponent(id) + "/open", {}); } catch (e) { $("err").textContent = e.message; }
};
$("close").onclick = () => window.close();
</script>
</body>
</html>
